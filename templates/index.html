<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{{ company }} — Email Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; color: #333; }

    header {
      background: #1a1a2e;
      color: white;
      padding: 18px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { font-size: 20px; letter-spacing: 1px; }
    header span { font-size: 13px; opacity: 0.6; }
    #live-dot {
      display: inline-block; width: 8px; height: 8px;
      background: #4caf50; border-radius: 50%; margin-right: 6px;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    .container { max-width: 1100px; margin: 0 auto; padding: 28px 20px; }

    /* --- Stat Cards --- */
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 28px; }
    .card {
      background: white; border-radius: 12px; padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      border-top: 4px solid #ccc;
    }
    .card.total  { border-color: #1a1a2e; }
    .card.sales  { border-color: #4caf50; }
    .card.account{ border-color: #2196f3; }
    .card.support{ border-color: #ff9800; }
    .card.general{ border-color: #9c27b0; }
    .card.skipped{ border-color: #9e9e9e; }

    .card-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #888; margin-bottom: 8px; }
    .card-value { font-size: 36px; font-weight: 700; color: #1a1a2e; }
    .card-sub   { font-size: 11px; color: #aaa; margin-top: 4px; }

    /* --- Table --- */
    .section-title {
      font-size: 14px; font-weight: 600; color: #555;
      text-transform: uppercase; letter-spacing: 1px;
      margin-bottom: 12px;
    }
    .table-wrap { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); overflow: hidden; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { background: #1a1a2e; color: white; padding: 12px 16px; text-align: left; font-weight: 500; }
    td { padding: 11px 16px; border-bottom: 1px solid #f0f0f0; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafafa; }

    .badge {
      display: inline-block; padding: 3px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .badge-sales   { background: #e8f5e9; color: #2e7d32; }
    .badge-account { background: #e3f2fd; color: #1565c0; }
    .badge-support { background: #fff3e0; color: #e65100; }
    .badge-general { background: #f3e5f5; color: #6a1b9a; }

    .empty { text-align: center; padding: 40px; color: #bbb; font-size: 14px; }
    #last-updated { font-size: 11px; color: #aaa; text-align: right; margin-top: 10px; }
  </style>
</head>
<body>

<header>
  <h1>{{ company }} &mdash; Email Dashboard</h1>
  <span><span id="live-dot"></span>Live &bull; Refreshes every 30s</span>
</header>

<div class="container">
  <div class="cards">
    <div class="card total">
      <div class="card-label">Total Today</div>
      <div class="card-value" id="total">—</div>
      <div class="card-sub" id="today-date">Loading...</div>
    </div>
    <div class="card sales">
      <div class="card-label">Sales</div>
      <div class="card-value" id="cnt-sales">—</div>
      <div class="card-sub" id="email-sales"></div>
    </div>
    <div class="card account">
      <div class="card-label">Account</div>
      <div class="card-value" id="cnt-account">—</div>
      <div class="card-sub" id="email-account"></div>
    </div>
    <div class="card support">
      <div class="card-label">Support</div>
      <div class="card-value" id="cnt-support">—</div>
      <div class="card-sub" id="email-support"></div>
    </div>
    <div class="card general">
      <div class="card-label">General</div>
      <div class="card-value" id="cnt-general">—</div>
      <div class="card-sub" id="email-general"></div>
    </div>
    <div class="card skipped">
      <div class="card-label">Skipped</div>
      <div class="card-value" id="skipped">—</div>
      <div class="card-sub">Auto / newsletters</div>
    </div>
  </div>

  <div class="section-title">Recent Emails Processed</div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Time</th>
          <th>From</th>
          <th>Subject</th>
          <th>Department</th>
          <th>Replied To</th>
        </tr>
      </thead>
      <tbody id="email-table">
        <tr><td colspan="5" class="empty">Loading...</td></tr>
      </tbody>
    </table>
  </div>
  <div id="last-updated"></div>
</div>

<script>
  function badgeClass(dept) {
    const map = { sales: 'badge-sales', account: 'badge-account', support: 'badge-support', general: 'badge-general' };
    return map[dept] || 'badge-general';
  }

  function loadStats() {
    fetch('/api/stats')
      .then(r => r.json())
      .then(data => {
        document.getElementById('total').textContent = data.total;
        document.getElementById('skipped').textContent = data.skipped;
        document.getElementById('today-date').textContent = data.date;
        const depts = ['sales', 'account', 'support', 'general'];
        depts.forEach(d => {
          const info = data.departments[d] || {};
          document.getElementById('cnt-' + d).textContent = info.count ?? 0;
          document.getElementById('email-' + d).textContent = info.email || '';
        });
      });
  }

  function loadEmails() {
    fetch('/api/emails')
      .then(r => r.json())
      .then(data => {
        const tbody = document.getElementById('email-table');
        if (!data.length) {
          tbody.innerHTML = '<tr><td colspan="5" class="empty">No emails processed yet today.</td></tr>';
          return;
        }
        tbody.innerHTML = data.map(e => `
          <tr>
            <td>${e.timestamp}</td>
            <td>${e.from.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</td>
            <td>${e.subject.replace(/</g,'&lt;')}</td>
            <td><span class="badge ${badgeClass(e.department)}">${e.department}</span></td>
            <td>${e.replied_to.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</td>
          </tr>
        `).join('');
        document.getElementById('last-updated').textContent =
          'Last updated: ' + new Date().toLocaleTimeString();
      });
  }

  function refresh() { loadStats(); loadEmails(); }
  refresh();
  setInterval(refresh, 30000);
</script>
</body>
</html>
